appId: com.zcode.buddy
productName: ZCode Buddy
directories:
  output: release
files:
  - dist/**
  - electron/**
  - core/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
portable:
  artifactName: ${productName}-${version}-portable.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ZCode Buddy
