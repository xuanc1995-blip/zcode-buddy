<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .card {
    height: 100%; border-radius: 16px; overflow: hidden; position: relative;
    background: linear-gradient(160deg, #14151f 0%, #0e0f16 70%);
    border: 1px solid rgba(255, 255, 255, 0.09);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    transition: opacity 0.22s ease;
  }
  .bye { opacity: 0; }

  .logo {
    width: 58px; height: 58px; border-radius: 18px;
    background: linear-gradient(135deg, #6c7bff, #9d6bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #fff; box-shadow: 0 8px 28px rgba(108, 123, 255, 0.45);
    animation: pop 0.5s cubic-bezier(0.22, 1.2, 0.36, 1) both, glow 2.2s ease-in-out 0.5s infinite;
  }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes glow {
    0%, 100% { box-shadow: 0 8px 28px rgba(108, 123, 255, 0.45); }
    50% { box-shadow: 0 8px 40px rgba(157, 107, 255, 0.75); }
  }

  .name { margin-top: 14px; font-size: 19px; font-weight: 700; color: #ecedf5; letter-spacing: 0.5px;
          animation: fadeUp 0.4s ease 0.18s both; }
  .sub { margin-top: 4px; font-size: 11.5px; color: #8f92ad; animation: fadeUp 0.4s ease 0.26s both; }

  .feats { margin-top: 20px; display: flex; flex-direction: column; gap: 9px; }
  .feat {
    display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: #b9bcd0;
    opacity: 0; animation: fadeUp 0.4s ease both;
  }
  .feat .dot { width: 5px; height: 5px; border-radius: 50%; background: linear-gradient(135deg, #6c7bff, #9d6bff); }
  .feat:nth-child(1) { animation-delay: 0.38s; }
  .feat:nth-child(2) { animation-delay: 0.52s; }
  .feat:nth-child(3) { animation-delay: 0.66s; }
  .feat:nth-child(4) { animation-delay: 0.8s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
         background: rgba(255, 255, 255, 0.06); }
  .bar i { display: block; height: 100%; width: 0; border-radius: 0 3px 3px 0;
           background: linear-gradient(90deg, #6c7bff, #3ecf8e);
           animation: load 1.5s cubic-bezier(0.3, 0.6, 0.4, 1) forwards; }
  @keyframes load { from { width: 4%; } to { width: 100%; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">⚡</div>
    <div class="name">ZCode Buddy</div>
    <div class="sub">多账号切换 · 额度管理</div>
    <div class="feats">
      <div class="feat"><span class="dot"></span>多账号热切换，主窗口不关闭</div>
      <div class="feat"><span class="dot"></span>额度实时看板与可撑天数预测</div>
      <div class="feat"><span class="dot"></span>低额度自动提醒与建议切换</div>
      <div class="feat"><span class="dot"></span>登录历史 · 自动更新 · 加密备份</div>
    </div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
