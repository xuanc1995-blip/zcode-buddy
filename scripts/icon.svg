<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232344"/>
      <stop offset="1" stop-color="#0d0d17"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#9d6bff"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cdff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#6c7bff" flood-opacity="0.55"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="2" refY="5"
            markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="url(#ring)"/>
    </marker>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- 循环切换箭头（右、左两段弧） -->
  <g stroke="url(#ring)" stroke-width="66" fill="none" stroke-linecap="round"
     marker-end="url(#ah)" filter="url(#glow)">
    <path d="M 614 198 A 330 330 0 0 1 614 826"/>
    <path d="M 410 826 A 330 330 0 0 1 410 198"/>
  </g>

  <!-- 中央闪电 -->
  <path d="M 600 170 L 380 555 L 505 555 L 435 850 L 665 445 L 528 445 Z"
        fill="url(#bolt)" filter="url(#glow)"/>
</svg>
