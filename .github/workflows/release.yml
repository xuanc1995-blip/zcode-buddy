name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build & package (NSIS + portable)
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx vite build && npx electron-builder --win --publish never

      # electron-updater 需要 latest.yml（含校验和）作为 Release 附件才能检测更新
      - name: Generate latest.yml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release" -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $setup) { Write-Error "Setup exe not found"; exit 1 }
          $sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $sha512 = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash([System.IO.File]::ReadAllBytes($setup.FullName)))
          $version = "${{ github.ref_name }}".TrimStart("v")
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $yml = @"
          version: $version
          path: $($setup.Name)
          sha2: $sha256
          sha512: $sha512
          releaseDate: '$date'
          files:
            - url: $($setup.Name)
              sha2: $sha256
              sha512: $sha512
              size: $($setup.Length)
          "@
          Set-Content -Path "release/latest.yml" -Value $yml -Encoding ascii
          Write-Host "latest.yml generated for $($setup.Name)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zcode-buddy-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
